# Spring Boot Application Configuration
spring.application.name=web-assist-ai-backend

spring.profiles.active=dev

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME}

app.redis.enabled=${APP_REDIS_ENABLED:false}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

logging.level.org.springframework.boot.autoconfigure=INFO

# Server Port
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/web_assist_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:3366}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true
# spring.flyway.baseline-version=0
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=validate
   
# Logging
logging.level.root=INFO
logging.level.com.assistai=DEBUG
logging.level.org.springframework.web=DEBUG

# Đặt log level cho package chứa service của bạn
logging.level.com.saasai.service=INFO


# JWT Configuration
jwt.secret=${JWT_SECRET:local_dev_jwt_secret_please_change_this_and_set_env}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION_MS:86400000}

# CORS Configuration
# CORS Configuration
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,https://curdle-domestic-cane.ngrok-free.dev,https://project-saas-test.vercel.app}
# Rate limiting configuration
ratelimit.auth.login.limit=${RATE_LIMIT_AUTH_LOGIN:10}
ratelimit.credits.estimate.limit=${RATE_LIMIT_CREDITS_ESTIMATE:30}
ratelimit.files.upload.limit=${RATE_LIMIT_FILES_UPLOAD:10}
ratelimit.ai.completions.limit=${RATE_LIMIT_AI_COMPLETIONS:20}
ratelimit.window.seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# Storage Configuration
storage.type=${STORAGE_TYPE:local}
storage.local.base-path=${STORAGE_LOCAL_BASE_PATH:uploads/} 
storage.base-url=${STORAGE_BASE_URL:http://localhost:8080/uploads/}

# 🎯 BẬT S3 LÊN
# storage.type=s3
# storage.base-url=https://ten-bucket-cua-tai.s3.ap-southeast-1.amazonaws.com/

# Điền các thông tin bảo mật của AWS S3 gác cổng
# aws.s3.bucket-name=my-saas-bucket
# aws.s3.access-key=AKIAIOSFODNN7EXAMPLE
# aws.s3.secret-key=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads/

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# Rate limiting configuration
ratelimit.auth.login-limit=${RATE_LIMIT_AUTH_LOGIN:10}
ratelimit.credits.estimate-limit=${RATE_LIMIT_CREDITS_ESTIMATE:30}
ratelimit.files.upload-limit=${RATE_LIMIT_FILES_UPLOAD:10}
ratelimit.ai.completions-limit=${RATE_LIMIT_AI_COMPLETIONS:20}
ratelimit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ==================== Google OAuth2 ====================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Optional: Provider config
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# OpenRouter API Configuration
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.timeout=${OPENROUTER_TIMEOUT:120s}


openrouter.site-url=${OPENROUTER_SITE_URL:http://localhost:3000}
openrouter.app-name=${OPENROUTER_APP_NAME:Web Assist AI}

ai.max-tokens=${AI_MAX_TOKENS:3000}
ai.temperature=${AI_TEMPERATURE:0}

# Payment
sepay.webhook.secret=${SEPAY_WEBHOOK_SECRET:your_sepay}

# Timezone Configuration
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# AI Credit Configuration
ai.credit.base-hold=${AI_CREDIT_BASE_HOLD:10.0}
ai.credit.output-weight=${AI_CREDIT_OUTPUT_WEIGHT:5.0}
ai.min-credit-per-call=${AI_MIN_CREDIT_PER_CALL:1.0}

