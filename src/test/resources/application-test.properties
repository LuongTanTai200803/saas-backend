spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=false
spring.sql.init.mode=never

jwt.secret=test_jwt_secret_32_chars_long_value_12345
jwt.expiration=86400000

frontend.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

ratelimit.auth.login.limit=100
ratelimit.credits.estimate.limit=100
ratelimit.files.upload.limit=100
ratelimit.ai.completions.limit=100
ratelimit.window.seconds=60

# OpenRouter API Configuration
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.timeout=${OPENROUTER_TIMEOUT:30000}


openrouter.site-url=${OPENROUTER_SITE_URL:http://localhost:3000}
openrouter.app-name=${OPENROUTER_APP_NAME:Web Assist AI}
